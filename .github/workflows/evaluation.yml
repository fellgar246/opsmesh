name: Full evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    environment: demo
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opsmesh
          POSTGRES_PASSWORD: opsmesh
          POSTGRES_DB: opsmesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsmesh -d opsmesh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://opsmesh:opsmesh@localhost:5432/opsmesh
      AWS_AGENTIC_FEATURES_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Refuse live model evaluation
        run: test "${OPSMESH_LIVE_EVAL:-}" != "1"
      - name: Score the full suite
        run: |
          cd apps/api
          uv sync --frozen
          uv run alembic upgrade head
          uv run python -m opsmesh_api.services.seed
          uv run python -m opsmesh_api.evaluation full
