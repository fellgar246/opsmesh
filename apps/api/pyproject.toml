[project]
name = "opsmesh-api"
version = "0.1.0"
description = "OpsMesh control-plane API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.115",
  "psycopg[binary]>=3.2",
  "pydantic>=2",
  "pydantic-settings>=2",
  "sqlalchemy>=2",
  "structlog>=24",
  "uvicorn>=0.32",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "mypy>=1.13",
  "pytest>=8",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opsmesh_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["opsmesh_api", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["opsmesh_api"]
mypy_path = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
